# Local backing services. Credentials here are for local dev only, not secrets.
name: the-bakery
services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: bakery
      POSTGRES_DB: bakery
    ports:
      - "127.0.0.1:4820:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
