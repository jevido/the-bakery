# Local backing services. Credentials here are for local dev only, not secrets.
name: the-bakery
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: bakery
      POSTGRES_DB: bakery
    ports:
      - "127.0.0.1:4820:5432"
    volumes:
      # Postgres 18 images keep data in /var/lib/postgresql/<major>/; mount
      # the parent. A new volume, since 17's data cannot be opened by 18.
      - postgres18:/var/lib/postgresql

volumes:
  postgres18:
