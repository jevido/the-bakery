services:
  # Local dev only — this file has no production role at all anymore.
  # Production Postgres is provisioned natively as a rootless Podman Quadlet
  # unit by `bakery bootstrap` (agent/postgres.go, Phase 08 task 05), not
  # via compose. Bound to loopback since that's this file's own convention
  # for every dev-only service here, not because anything downstream
  # depends on it.
  db:
    image: docker.io/library/postgres
    restart: always
    ports:
      - 127.0.0.1:5434:5432
    # POSTGRES_PASSWORD comes from .env (see .env.example) via env_file:,
    # same mechanism the bakery service used to use here before production
    # moved off compose entirely (Phase 08 task 14).
    env_file: .env
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
  # Bakery-hosted private registry (task 08) — the distribution/distribution
  # reference implementation, run as a plain compose service for local dev
  # only. Production runs its own instance of this same image as a native
  # Quadlet unit instead (agent/registry.go, Phase 08 task 10) — see
  # registry-auth/README.md for this dev instance's auth setup.
  registry:
    image: docker.io/library/registry:2
    restart: always
    ports:
      - 127.0.0.1:5050:5000
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Bakery Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      - ./registry-auth:/auth:ro
volumes:
  pgdata:
  registry-data:
