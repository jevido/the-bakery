# Desktop release: a tag desktop-vX.Y.Z builds the app for Linux, signs the
# update file and publishes a GitHub release with a Wails update manifest.
# Windows and macOS builds are left out for now; the Wails build tasks for
# them are still in apps/desktop/build/. The running app reads that manifest to update
# itself (apps/desktop, "self-update").
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  # Rebuild an existing tag with the workflow as it is on the default branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. desktop-v0.1.0"
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.18
  TAG: ${{ inputs.tag || github.ref_name }}
  API_URL: https://api.bakery.jevido.app
  WEB_URL: https://bakery.jevido.app

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: apps/desktop/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev file

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Version from the tag
        run: |
          VERSION="${TAG#desktop-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Stamp it into the platform metadata (Info.plist, NSIS, nfpm, ...).
          sed -i.bak -E "s/^(  version: )\"[^\"]*\"/\1\"$VERSION\"/" apps/desktop/build/config.yml
          rm apps/desktop/build/config.yml.bak

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and package
        working-directory: apps/desktop
        run: |
          wails3 task common:update:build-assets
          LDFLAGS="-X main.version=$VERSION -X main.defaultAPIURL=$API_URL -X main.defaultWebURL=$WEB_URL"
          case "${{ matrix.platform }}" in
            linux)   wails3 task linux:package EXTRA_LDFLAGS="$LDFLAGS" ;;
          esac

      - name: Collect release files
        working-directory: apps/desktop
        run: |
          mkdir -p dist
          N="the-bakery-$VERSION"
          case "${{ matrix.platform }}" in
            linux)
              # The AppImage installs and updates; the deb is for apt users.
              cp bin/*.AppImage "dist/$N-linux-x86_64.AppImage"
              cp bin/the-bakery.deb "dist/the-bakery_${VERSION}_amd64.deb"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.platform }}
          path: apps/desktop/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: Install wails3
        # The CLI links against GTK/WebKit even when it only signs files.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same notes go on the release page and into the manifest, where
          # the app shows them in its update panel.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -q .body > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Sign and write the update manifest
        env:
          BAKERY_UPDATE_KEY: ${{ secrets.BAKERY_UPDATE_KEY }}
        run: |
          VERSION="${TAG#desktop-v}"
          umask 077
          printf '%s\n' "$BAKERY_UPDATE_KEY" > "$RUNNER_TEMP/updater.key"
          cd dist
          # Only the files the updater installs go in the manifest.
          wails3 updater manifest \
            -version "$VERSION" \
            -name "The Bakery $VERSION" \
            -notes-file "$RUNNER_TEMP/notes.md" \
            -key "$RUNNER_TEMP/updater.key" \
            -url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            -output manifest.json \
            ./*.AppImage
          wails3 updater verify -manifest manifest.json -publickey ../apps/desktop/build/updater.pub
          rm "$RUNNER_TEMP/updater.key"
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#desktop-v}"
          gh release create "$TAG" dist/* \
            --title "The Bakery $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
