name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

  build:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub-hosted Ubuntu runners ship Docker, not Podman, by default —
      # this repo's own infra (agent, build-worker, and this Containerfile
      # per Phase 08 task 01) is Podman-first throughout.
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build container image
        run: podman build -f Containerfile -t bakery-control-plane:ci .

  release-agent:
    name: Publish Agent Binaries to GitHub Releases
    runs-on: ubuntu-latest
    needs: [check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      # Same cross-compile as the Containerfile's agent-build stage, but
      # published to a fixed location (GitHub Releases) rather than baked
      # into a container image — Phase 08 task 04's install.sh needs a
      # binary source that exists before any Bakery control plane does,
      # for bootstrapping a brand-new instance from nothing.
      - name: Cross-compile bakery binaries
        working-directory: agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../bakery-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bakery-linux-arm64 .

      # Single moving `latest` release, overwritten on every push to main —
      # there's no versioning scheme for the agent independent of the app
      # itself yet, so "whatever main currently builds" is the only
      # release that exists. install.sh's fallback download URL
      # (github.com/jevido/the-bakery/releases/latest/download/...)
      # depends on this tag name specifically.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (auto-updated on every push to main)
          body: |
            Automated, moving release: the `bakery` agent binaries and
            root install shim currently on `main`. Not a versioned
            software release — always reflects the latest commit.
          make_latest: true
          files: |
            bakery-linux-amd64
            bakery-linux-arm64
            src/lib/server/agent/install.sh

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: [check, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/the-bakery
    steps:
      - uses: actions/checkout@v7

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: podman login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and tag image
        run: |
          podman build -f Containerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push image
        run: |
          podman push ${{ env.IMAGE }}:${{ github.sha }}
          podman push ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to jevido.app
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: SSH deploy, migrate, health-check, roll back on failure
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: bakery
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd ~/bakery

            NEW_TAG="${{ github.sha }}"
            STATE_FILE="$HOME/bakery/.last-good-tag"
            PREV_TAG=$(cat "$STATE_FILE" 2>/dev/null || echo "latest")

            deploy_tag() {
              local tag="$1"
              podman pull "ghcr.io/jevido/the-bakery:${tag}"
              sed -i "s/^BAKERY_IMAGE_TAG=.*/BAKERY_IMAGE_TAG=\"${tag}\"/" .env
              # -T: without it, `run` allocates a pseudo-tty and can consume
              # bytes from this whole script's own stdin (it arrives over
              # the same SSH session) — silently truncating everything after
              # it. --no-deps: db doesn't need recreating just because
              # bakery's image changed.
              podman-compose -f compose.yaml -f compose.prod.yaml run --rm -T bakery \
                node node_modules/.bin/drizzle-kit migrate < /dev/null
              podman-compose -f compose.yaml -f compose.prod.yaml up -d --force-recreate --no-deps bakery
            }

            # A failure partway through deploy_tag (pull/migrate/recreate,
            # not just an app that starts but then crashes) should still
            # fall through to the health check below rather than aborting
            # the whole script with no rollback attempt at all.
            deploy_tag "$NEW_TAG" || true

            healthy=""
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login || echo "000")
              if [ "$code" = "200" ]; then
                healthy=1
                break
              fi
              sleep 3
            done

            if [ -n "$healthy" ]; then
              echo "$NEW_TAG" > "$STATE_FILE"
              echo "Deployed $NEW_TAG successfully."

              # Build-worker (task 07) runs natively, not from the image
              # above — its own checkout just needs updating to the same
              # commit and restarting. Only on a successful web app deploy,
              # never as part of a rollback attempt.
              cd /opt/bakery/app
              git fetch origin main
              git reset --hard origin/main
              /home/bakery/.bun/bin/bun install --frozen-lockfile
              systemctl --user restart bakery-build-worker
            else
              echo "Health check failed for $NEW_TAG — rolling back to $PREV_TAG" >&2
              deploy_tag "$PREV_TAG"
              echo "Rolled back to $PREV_TAG." >&2
              exit 1
            fi
