services:
  # No db/registry overrides needed here at all — compose.yaml already binds
  # both to 127.0.0.1 (not 0.0.0.0) and sources `db`'s password from .env
  # directly (see compose.yaml's comments for why: two different cross-file
  # override attempts here — a second `ports:` entry, then a nested
  # `environment:` scalar override — both turned out to be unreliable with
  # podman-compose's file-merging, found the hard way while bootstrapping
  # production). One mechanism, one source of truth, for both dev and prod.

  # The control plane app itself (Phase 08 task 01). References the image
  # task 03's CI already built and pushed to GHCR — never built from source
  # on the production box itself, so a deploy is just "pull the new tag,
  # recreate the container" (task 06), with no build tooling or repo
  # checkout needed here for this service. `BAKERY_IMAGE_TAG` lets task 06's
  # CD step pin an exact commit SHA; defaults to `latest` for the initial
  # bootstrap. Real secrets come from a production .env on the box, never
  # committed. Published to loopback only — Caddy proxies to it over
  # 127.0.0.1, matching how it already reverse-proxies customer app units
  # (src/lib/server/deploy/proxy.ts's `caddySiteBlock`).
  bakery:
    image: ghcr.io/jevido/the-bakery:${BAKERY_IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - 127.0.0.1:3000:3000
