services:
  # compose.yaml already binds db/registry to 127.0.0.1 (not 0.0.0.0) by
  # default, so there's no port override needed here — Compose Specification
  # merges list fields like `ports:` across -f files (concatenates them)
  # rather than replacing, so re-declaring `ports:` here would have produced
  # a second, conflicting binding on the same host port instead of an
  # override (caught the hard way: `podman-compose up` failed with
  # "address already in use" against its own just-created container).
  #
  # POSTGRES_PASSWORD overrides compose.yaml's hardcoded dev value
  # ("mysecretpassword") — set in the box's real .env (never committed),
  # not baked into this file. Only meaningful when this file is actually
  # used (production); dev never invokes compose.prod.yaml at all.
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # The control plane app itself (Phase 08 task 01). References the image
  # task 03's CI already built and pushed to GHCR — never built from source
  # on the production box itself, so a deploy is just "pull the new tag,
  # recreate the container" (task 06), with no build tooling or repo
  # checkout needed here for this service. `BAKERY_IMAGE_TAG` lets task 06's
  # CD step pin an exact commit SHA; defaults to `latest` for the initial
  # bootstrap. Real secrets come from a production .env on the box, never
  # committed. Published to loopback only — Caddy proxies to it over
  # 127.0.0.1, matching how it already reverse-proxies customer app units
  # (src/lib/server/deploy/proxy.ts's `caddySiteBlock`).
  bakery:
    image: ghcr.io/jevido/the-bakery:${BAKERY_IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    depends_on:
      - db
    ports:
      - 127.0.0.1:3000:3000
