# Root task runner. Units keep their own tooling; the tasks below are thin
# entry points into them. Call sub-tasks through {{.TASK_EXE}}.

version: "3"

includes:
  api:
    taskfile: services/api/Taskfile.yml
    dir: services/api
  desktop:
    taskfile: apps/desktop/Taskfile.yml
    dir: apps/desktop
    vars:
      APP_ROOT: '{{.ROOT_DIR}}/apps/desktop'
  web:
    taskfile: apps/web/Taskfile.yml
    dir: apps/web
  console:
    taskfile: apps/console/Taskfile.yml
    dir: apps/console
  ui:
    taskfile: packages/ui/Taskfile.yml
    dir: packages/ui

vars:
  # Every port a dev server listens on, for `task down`. Keep in sync with the
  # table in CLAUDE.md. Postgres (4820) is left out on purpose: it is a
  # container, stopped with `task db:down`.
  DEV_PORTS: "4810 4830 4840 4850"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  down:
    desc: Stop every dev server this repo started
    silent: true
    cmds:
      - ./infra/dev/down.sh {{.DEV_PORTS}}

  dev:
    desc: Start Postgres, migrate, then run the API, the desktop app, the website and the console (Ctrl+C stops all)
    cmds:
      - task: db:up
      - task: db:wait
      - task: api:migrate
      - task: dev:servers

  dev:servers:
    internal: true
    # Add each unit's dev task here; they run in parallel.
    deps: [api:dev, desktop:dev, web:dev, console:dev]

  seed:
    desc: Seed the dev database (First Colony with ada, bram and cas @bakery.test, password "password")
    cmds:
      - task: db:up
      - task: db:wait
      - task: api:migrate
      - task: api:seed

  db:up:
    desc: Start the dev Postgres (Podman)
    cmds:
      - podman compose -f infra/dev/compose.yml up -d

  db:wait:
    # Over TCP: during first-start initialisation Postgres answers on its
    # socket only, then restarts.
    desc: Wait until the dev Postgres accepts connections (30s at most)
    silent: true
    cmds:
      - |
        for i in $(seq 1 30); do
          podman compose -f infra/dev/compose.yml exec -T postgres pg_isready -h 127.0.0.1 -U bakery -q 2>/dev/null && exit 0
          sleep 1
        done
        echo "Postgres did not become ready within 30s" >&2
        exit 1

  db:down:
    desc: Stop the dev Postgres
    cmds:
      - podman compose -f infra/dev/compose.yml down

  image:api:
    desc: Build the API container image (bakery-api)
    cmds:
      - podman build -f infra/images/api/Containerfile -t bakery-api .

  image:web:
    desc: Build the website container image (bakery-web); VITE_API_URL=... to set the API
    cmds:
      - podman build -f infra/images/web/Containerfile --build-arg VITE_API_URL={{.VITE_API_URL}} -t bakery-web .

  image:console:
    desc: Build the operator console image (bakery-console); VITE_API_URL=... to set the API
    cmds:
      - podman build -f infra/images/console/Containerfile --build-arg VITE_API_URL={{.VITE_API_URL}} -t bakery-console .

  check:
    desc: Format check, lint, test and type-check every unit
    # Add each unit's checks here as units appear.
    cmds:
      - task: api:check
      - task: ui:check
      - task: desktop:check
      - task: web:check
      - task: console:check
